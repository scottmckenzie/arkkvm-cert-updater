[project]
name = "arkkvm-cert-updater"
version = "0.1.0"
description = "Install Let's Encrypt certificates on ArkKVM devices, with a certbot deploy hook"
readme = "README.md"
authors = [
    { name = "Scott McKenzie", email = "scott@noizyland.net" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "aiortc>=1.15.0",
    "cryptography>=50.0.2",
]

[project.scripts]
arkkvm-cert-updater = "arkkvm_cert_updater.cli:main_exit"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.17.2",
    "pyrefly>=1.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # the formatter manages line length; long strings are left alone

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["arkkvm_cert_updater"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src", "tests"]
