[project]
name = "arkkvm-cert-updater"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "aiortc>=1.15.0",
    "cryptography>=50.0.2",
]

[project.scripts]
arkkvm_update_cert = "arkkvm_update_cert:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["arkkvm_update_cert"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
