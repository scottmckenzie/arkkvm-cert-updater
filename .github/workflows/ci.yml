name: CI
on:
  pull_request: {}
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked
      - name: Smoke check
        run: uv run arkkvm_update_cert --help
      - name: Run tests
        run: uv run pytest --cov=arkkvm_update_cert --cov-report=term-missing --cov-fail-under=80
